name: Quiz Scheduler

on:
  schedule:
    # Run every Monday and Thursday at 11:00 AM UTC
    - cron: '0 11 * * 1,4'
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-quiz:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run quizzer
        run: uv run python main.py

